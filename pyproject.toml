[project]
name = "ghastly-backend"
version = "0.1.0"
description = "API de finanzas personales (Guatemala, GTQ)"
requires-python = ">=3.13"
dependencies = [
  "fastapi[standard]>=0.115",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "pydantic>=2.9",
  "pydantic[email]>=2.9",
  "pydantic-settings>=2.6",
  "pyjwt[crypto]>=2.9",
  "argon2-cffi>=23.1",
  "structlog>=24.4",
  "slowapi>=0.1.9",
  "boto3>=1.35",
  "apscheduler>=3.10",
  "pyway>=0.3.33",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "testcontainers[postgres]>=4.8",
  "ruff>=0.7",
  "mypy>=1.13",
  "boto3-stubs[s3]>=1.43.90",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
# Documentos de planeación, no código: ruff format formatea bloques de código
# embebidos en Markdown desde 0.9, y no queremos que toque estos.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008: `Depends(...)` en un default de FastAPI es el idiom estándar del framework.
ignore = ["B008"]

[tool.mypy]
python_version = "3.13"
strict = true
exclude = ["migrations"]

[[tool.mypy.overrides]]
module = "apscheduler.*"
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "domain", "storage", "schemas", "services", "routers", "jobs"]
